<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Service Chatbot</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f0f2f5; font-family:-apple-system,sans-serif; display:flex; justify-content:center; min-height:100vh; }
.container { width:100%; max-width:720px; display:flex; flex-direction:column; padding:20px; }
h1 { margin:20px 0; text-align:center; color:#1a1a2e; }
.chat-box { flex:1; background:#fff; border-radius:12px; box-shadow:0 2px 12px rgba(0,0,0,0.08); display:flex; flex-direction:column; min-height:500px; }
.messages { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:12px; }
.msg { max-width:80%; padding:12px 16px; border-radius:12px; line-height:1.5; }
.user { background:#533483; color:#fff; align-self:flex-end; border-bottom-right-radius:4px; }
.bot { background:#f0f2f5; color:#1a1a2e; align-self:flex-start; border-bottom-left-radius:4px; }
.msg.bot .sources { font-size:12px; color:#888; margin-top:8px; }
.msg.bot .sources a { color:#533483; }
.input-area { display:flex; gap:8px; padding:16px; border-top:1px solid #e0e0e0; }
.input-area input { flex:1; padding:12px; border:1px solid #ddd; border-radius:8px; font-size:14px; outline:none; }
.input-area input:focus { border-color:#533483; }
.input-area button { padding:12px 24px; background:#533483; color:#fff; border:none; border-radius:8px; cursor:pointer; font-size:14px; }
.input-area button:hover { background:#6a42a0; }
.input-area button:disabled { background:#ccc; cursor:not-allowed; }
.loading { display:flex; gap:4px; align-items:center; padding:8px; }
.loading span { width:8px; height:8px; border-radius:50%; background:#533483; animation:bounce 1.4s infinite; }
.loading span:nth-child(2) { animation-delay:0.2s; }
.loading span:nth-child(3) { animation-delay:0.4s; }
@keyframes bounce { 0%,80%,100% { transform:translateY(0); } 40% { transform:translateY(-8px); } }
.admin-link { text-align:center; margin-top:12px; }
.admin-link a { color:#533483; text-decoration:none; font-size:13px; }
.empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:#aaa; gap:8px; }
.empty-state svg { width:64px; height:64px; stroke:#ccc; }
</style>
</head>
<body>
<div class="container">
  <h1>Customer Service</h1>
  <div class="chat-box">
    <div class="messages" id="messages">
      <div class="msg bot" id="welcome">
        Hello! How can I help you today?
      </div>
    </div>
    <form class="input-area" id="chat-form">
      <input type="text" id="input" placeholder="Type your question..." autofocus>
      <button type="submit" id="send-btn">Send</button>
    </form>
  </div>
  <div class="admin-link"><a href="/admin">Admin Panel — Manage Indexed Websites</a></div>
</div>

<script>
const form = document.getElementById("chat-form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send-btn");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg) return;

  input.value = "";
  welcome.style.display = "none";

  messages.innerHTML += `<div class="msg user">${escapeHtml(msg)}</div>`;
  messages.scrollTop = messages.scrollHeight;

  const loadingId = "loading-" + Date.now();
  messages.innerHTML += `<div class="msg bot" id="${loadingId}"><div class="loading"><span></span><span></span><span></span></div></div>`;
  messages.scrollTop = messages.scrollHeight;
  sendBtn.disabled = true;

  try {
    const resp = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: msg }),
    });
    const data = await resp.json();
    const loader = document.getElementById(loadingId);
    if (loader) loader.remove();

    let html = `<div class="msg bot">${escapeHtml(data.answer)}`;
    if (data.sources && data.sources.length) {
      html += `<div class="sources">Sources: ${data.sources.map(s => `<a href="${escapeHtml(s)}" target="_blank">${escapeHtml(s)}</a>`).join(", ")}</div>`;
    }
    html += `</div>`;
    messages.innerHTML += html;
  } catch (err) {
    const loader = document.getElementById(loadingId);
    if (loader) loader.remove();
    messages.innerHTML += `<div class="msg bot">Error: Could not reach the server.</div>`;
  }

  messages.scrollTop = messages.scrollHeight;
  sendBtn.disabled = false;
  input.focus();
});

function escapeHtml(text) {
  const div = document.createElement("div");
  div.appendChild(document.createTextNode(text));
  return div.innerHTML;
}
</script>
</body>
</html>
